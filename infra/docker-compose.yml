name: arenaz

services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: arenaz
      POSTGRES_PASSWORD: arenaz
      POSTGRES_DB: arenaz
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Over TCP on purpose: the unix socket already answers during the
      # entrypoint's temporary init server, before Postgres really accepts
      # connections from the host.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U arenaz -d arenaz']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
