name: arenaz

services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: arenaz
      POSTGRES_PASSWORD: arenaz
      POSTGRES_DB: arenaz
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Over TCP on purpose: the unix socket already answers during the
      # entrypoint's temporary init server, before Postgres really accepts
      # connections from the host.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U arenaz -d arenaz']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # MinIO stopped publishing its own images (minio/minio is gone from Docker
    # Hub); alpine/minio is an automated build of the upstream release tag.
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
    # The image runs as an unprivileged user that cannot write to a fresh named
    # volume (root-owned); this stack is local-only, so run as root.
    user: '0:0'
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '127.0.0.1:${MINIO_PORT:-9000}:9000'
      - '127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO /dev/null http://127.0.0.1:9000/minio/health/live
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # One-shot: creates the photo bucket (idempotent) and makes objects publicly
  # readable. Exits 0, which `docker compose up --wait` accepts.
  minio-init:
    image: amazon/aws-cli:2.39.1
    depends_on:
      minio:
        condition: service_healthy
    restart: 'no'
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: [/bin/sh, -c]
    command:
      - |
        set -eu
        s3="aws --endpoint-url http://minio:9000 s3api"
        $$s3 head-bucket --bucket arenaz-photos 2>/dev/null || $$s3 create-bucket --bucket arenaz-photos
        $$s3 put-bucket-policy --bucket arenaz-photos --policy '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"AWS":["*"]},"Action":["s3:GetObject"],"Resource":["arn:aws:s3:::arenaz-photos/*"]}]}'

volumes:
  postgres-data:
  minio-data:
