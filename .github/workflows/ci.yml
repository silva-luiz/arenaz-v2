name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: arenaz
          POSTGRES_PASSWORD: arenaz
          POSTGRES_DB: arenaz
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arenaz -d arenaz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Fixed throwaway values for the CI run. None of these is a secret: the
    # database lives and dies with the runner, and BETTER_AUTH_SECRET only
    # signs sessions of the e2e servers started below.
    env:
      DATABASE_URL: postgres://arenaz:arenaz@localhost:5432/arenaz
      REDIS_URL: redis://localhost:6379 # validated by the API, not used yet
      BETTER_AUTH_SECRET: ci-test-value-not-a-secret-0123456789abcdef
      BETTER_AUTH_URL: http://localhost:3100
      WEB_ORIGIN: http://localhost:3100
      API_URL: http://localhost:4100
      API_PORT: '4100'
      E2E_WEB_PORT: '3100'
      E2E_API_PORT: '4100'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Version comes from `packageManager` in the root package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Unit and integration tests start their own Postgres through
      # Testcontainers (Docker is available on the runner).
      - run: pnpm turbo run lint typecheck test build

      - run: pnpm --filter @arenaz/web exec playwright install --with-deps chromium

      - run: pnpm e2e

      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/web/e2e/playwright-report
            apps/web/e2e/test-results
          if-no-files-found: ignore
          retention-days: 7
